[package]
name = "portex-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
portex = { path = ".." }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[lints.rustdoc]
all = "deny"

[[bin]]
name = "fuzz-pe-headers"
path = "fuzz_targets/fuzz-pe-headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz-pe-parse"
path = "fuzz_targets/fuzz-pe-parse.rs"
test = false
doc = false
bench = false
