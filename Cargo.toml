[package]
name = "portex"
version = "0.2.0"
edition = "2024"
description = "A no_std-friendly parser, editor, and builder for raw and mapped PE executable images"
license = "MIT"
repository = "https://github.com/coconutbird/portex"
readme = "README.md"
keywords = ["pe", "portable-executable", "windows", "exe", "dll"]
categories = ["parsing", "development-tools"]

[features]
default = ["std"]
std = ["nostdio/std"]

[dependencies]
nostdio = { version = "0.2.0", default-features = false }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[lints.rustdoc]
all = "deny"
