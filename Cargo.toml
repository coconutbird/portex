# Taplo 0.9 cannot resolve SchemaStore's split Cargo lint schemas.
#:schema https://raw.githubusercontent.com/SchemaStore/schemastore/cf458e6e33141d3a0506f24279de79eeeeb5130a/src/schemas/json/cargo.json

[package]
name = "portex"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A no_std-friendly parser, editor, and builder for raw and mapped PE executable images"
license = "MIT"
repository = "https://github.com/coconutbird/portex"
readme = "README.md"
keywords = ["pe", "portable-executable", "windows", "exe", "dll"]
categories = ["parsing", "development-tools"]

[features]
default = ["std"]
std = ["nostdio/std"]

[dependencies]
nostdio = { version = "0.2", default-features = false }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[lints.rustdoc]
all = "deny"
